<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/logo-transparent.png" />
    <link rel="apple-touch-icon" href="./src/assets/logo-universal.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.github.com" />

    <title>%VITE_APP_TITLE%</title>
    <meta name="description" content="%VITE_APP_DESCRIPTION%" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="%VITE_APP_PUBLISHER%" />
    <meta name="publisher" content="%VITE_APP_PUBLISHER%" />
    <link rel="author" href="%VITE_APP_AUTHOR_URL%" />
    <link rel="me" href="%VITE_APP_AUTHOR_URL%" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="%VITE_APP_NAME%" />

    <!-- AI crawler discovery -->
    <link
      rel="alternate"
      type="text/plain"
      href="/llms.txt"
      title="LLMs.txt — AI-readable summary"
    />

    <link rel="canonical" href="%VITE_APP_SITE_URL%/" />
    <link rel="alternate" hreflang="x-default" href="%VITE_APP_SITE_URL%/" />
    <link rel="alternate" hreflang="en" href="%VITE_APP_SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_APP_SITE_URL%/" />
    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="%VITE_APP_DESCRIPTION%" />
    <meta property="og:image" content="%VITE_APP_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="%VITE_APP_NAME% logo" />
    <meta property="og:site_name" content="%VITE_APP_NAME%" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%VITE_APP_SITE_URL%/" />
    <meta name="twitter:title" content="%VITE_APP_TITLE%" />
    <meta name="twitter:description" content="%VITE_APP_DESCRIPTION%" />
    <meta name="twitter:image" content="%VITE_APP_SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="%VITE_APP_NAME% logo" />

    <meta name="google-site-verification" content="YV3nSwq9cbo_FizN27UuHxjtAn0TnfTND4uy6dWHMu4" />
  </head>

  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif">
        <strong>JavaScript is required</strong> to use %VITE_APP_NAME%. Please enable JavaScript in
        your browser settings.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
